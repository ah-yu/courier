name: Install Obsidian (Linux, pinned)
description: Download, verify and unpack the pinned Obsidian Linux build used by the L3 suite.

# The L3 suite drives a real Obsidian, so CI needs a real app. The version is
# pinned twice on purpose: a test run must not change because Obsidian released
# a new build, and the checksum must match the asset that version names. Bump
# both together and re-run the full local L3 suite (see docs/testing.md).
inputs:
  version:
    description: Obsidian version to install.
    required: false
    default: "1.14.4"
  sha256:
    description: SHA-256 of `obsidian-<version>.tar.gz`.
    required: false
    default: "e70b7cd63787e7f798a84fec453f5c446b91877bd3f612e8fb98e9b76cc81120"

runs:
  using: composite
  steps:
    - name: Install Xvfb and the Electron runtime libraries
      shell: bash
      run: |
        sudo apt-get update
        # No CJK font package: `fonts-noto-cjk` is 61 MB of the ~85 MB this step
        # downloads on every run (the image does not ship it). On 2026-10-22 (run
        # 39852110911) the mirror served it at ~50 kB/s, setup spent 28m32s of the
        # job's 30-minute cap here, and the job was killed about a minute into the
        # suite. The CI gate runs with `COURIER_OBSIDIAN_E2E_LAYOUT=0`: every `itL`
        # case is skipped, and the value cases compare text, file state and
        # CSS-anchored corners — none of them depends on a glyph's shape.
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          xvfb xauth fluxbox x11-utils \
          fonts-liberation \
          libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 \
          libcups2t64 libgtk-3-0t64 libpango-1.0-0 libcairo2 \
          libgbm1 libdrm2 libxss1 libxtst6 libxrandr2 libxcomposite1 \
          libxdamage1 libxfixes3 libxkbcommon0 libasound2t64 libsecret-1-0

    - name: Restore the pinned build
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.local/opt/obsidian
        key: obsidian-${{ inputs.version }}-${{ inputs.sha256 }}

    - name: Download and verify
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        OBSIDIAN_VERSION: ${{ inputs.version }}
        OBSIDIAN_SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        archive="$RUNNER_TEMP/obsidian-${OBSIDIAN_VERSION}.tar.gz"
        install="$HOME/.local/opt/obsidian"
        curl -fsSL -o "$archive" \
          "https://github.com/obsidianmd/obsidian-releases/releases/download/v${OBSIDIAN_VERSION}/obsidian-${OBSIDIAN_VERSION}.tar.gz"
        echo "${OBSIDIAN_SHA256}  ${archive}" | sha256sum -c -
        rm -rf "$install"
        mkdir -p "$install"
        tar -xzf "$archive" -C "$install" --strip-components=1
        rm -f "$archive"

    - name: Expose the app and the CLI
      shell: bash
      run: |
        set -euo pipefail
        install="$HOME/.local/opt/obsidian"
        test -x "$install/obsidian"
        test -x "$install/obsidian-cli"
        chmod 755 "$install/obsidian" "$install/obsidian-cli"
        mkdir -p "$HOME/.local/bin"
        ln -sf "$install/obsidian-cli" "$HOME/.local/bin/obsidian"
        echo "Obsidian ${{ inputs.version }} (pinned) at $install"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        echo "COURIER_OBSIDIAN_APP=$install/obsidian" >> "$GITHUB_ENV"
        echo "COURIER_OBSIDIAN_CLI=$HOME/.local/bin/obsidian" >> "$GITHUB_ENV"

    - name: Pin Obsidian's update endpoints
      shell: bash
      # A pinned test build must not be replaced by a background auto-update in
      # the middle of a run. The app fails the check fast when the host answers
      # locally; plugin downloads (github.com) are untouched.
      run: |
        if ! grep -q "releases.obsidian.md" /etc/hosts; then
          echo "127.0.0.1 releases.obsidian.md" | sudo tee -a /etc/hosts
        fi
