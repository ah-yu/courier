name: Bench (sync)

# Wall-clock benchmarks on the sync path, reported on the pull request. They do
# not gate: only the correctness invariants the runner asserts can fail the job.
# See docs/ci-sync-benchmarks.md for the measurements and the comparison rules.
#
# A run costs ~3.5 minutes (measured on the 2-vCPU runner), so `paths` keeps
# docs and plugin-UI changes out. `workflow_dispatch` runs the three
# scenarios once, head only, and prints absolute numbers to the run's summary —
# useful for the benchmark itself and for "does this runner agree with my machine".
on:
  pull_request:
    paths:
      - "packages/engine/**"
      - "packages/cli/**"
      - "packages/server/**"
      - "packages/shared/**"
      - "packages/e2e/src/bench/**"
      - "packages/e2e/src/harness/**"
      - "scripts/bench.ts"
      - "scripts/bench-report.ts"
      - "package.json"
      - "bun.lock"
      - ".bun-version"
      - "vitest.config.ts"
      - ".github/workflows/bench.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: Sync benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # The baseline is the merge base, not today's main, so the delta is the pull
      # request's change. A branch that predates the benchmark runner has no base
      # side to run; the job then reports head only and says so.
      - name: Add the merge base as a second checkout
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          base="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
          echo "merge base: $base"
          git worktree add "$RUNNER_TEMP/base" "$base"
          if [ -f "$RUNNER_TEMP/base/scripts/bench.ts" ]; then
            ( cd "$RUNNER_TEMP/base" && bun install --frozen-lockfile )
          else
            echo "::notice::the merge base has no benchmark runner; the base side is skipped"
          fi

      - name: Run the paired benchmarks
        env:
          BENCH_FILES: "3000"
          BENCH_LARGE_MIB: "64"
          BENCH_CHURN_FILES: "500"
          BENCH_RESULTS: ${{ runner.temp }}/bench-results
        run: |
          set -euo pipefail
          sides="head"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ -f "$RUNNER_TEMP/base/scripts/bench.ts" ]; then
              sides="base head"
            fi
          fi
          for scenario in many large churn; do
            # Three rounds per side is what the medians need: two identical local
            # runs differed by up to 125% on the short phases. Dispatch runs once.
            rounds=3
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then rounds=1; fi
            for round in $(seq 1 "$rounds"); do
              for side in $sides; do
                root="$GITHUB_WORKSPACE"
                if [ "$side" = "base" ]; then root="$RUNNER_TEMP/base"; fi
                echo "::group::$scenario / $side / round $round"
                ( cd "$root" && BENCH_RUN_ID="$side-$round" \
                    BENCH_RESULTS_DIR="$BENCH_RESULTS/$side" bun run bench "$scenario" )
                echo "::endgroup::"
              done
            done
          done

      - name: Upload the raw runs
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: ${{ runner.temp }}/bench-results
          retention-days: 14

      - name: Summarize (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          bun scripts/bench-report.ts \
            --head "${{ runner.temp }}/bench-results/head" \
            --out "$RUNNER_TEMP/bench.md" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          cat "$RUNNER_TEMP/bench.md" >> "$GITHUB_STEP_SUMMARY"

  comment:
    name: Benchmark comment
    needs: bench
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The renderer is base-branch code: this job holds the write token, so it must
      # not execute a script from the pull request.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: bench-results
          path: bench-results

      - name: Render the comment
        run: |
          set -euo pipefail
          if [ ! -f scripts/bench-report.ts ]; then
            echo "::notice::the base branch has no renderer yet (this is the first run)"
            exit 0
          fi
          args=(--head bench-results/head)
          if compgen -G "bench-results/base/*.json" > /dev/null; then
            args+=(--base bench-results/base)
          fi
          bun scripts/bench-report.ts "${args[@]}" \
            --out "$RUNNER_TEMP/comment.md" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          cat "$RUNNER_TEMP/comment.md" >> "$GITHUB_STEP_SUMMARY"
          jq -Rs '{body: .}' "$RUNNER_TEMP/comment.md" > "$RUNNER_TEMP/comment.json"

      - name: Create or update the sticky comment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/comment.json" ]; then
            echo "::notice::no rendered comment to post"
            exit 0
          fi
          marker='<!-- courier-bench-summary -->'
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq ".[] | select(.body | contains(\"$marker\")) | .id" > "$RUNNER_TEMP/ids.txt"
          id="$(head -n 1 "$RUNNER_TEMP/ids.txt")"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" \
              --input "$RUNNER_TEMP/comment.json"
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
              --input "$RUNNER_TEMP/comment.json"
          fi
