name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (docs, migrations, lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Check release versions
        run: bun scripts/check-release.ts

      - name: Verify
        run: bun run verify

      # The per-package floors in `vitest.config.ts` are a ratchet only if something
      # runs the instrumented suite. It is opt-in locally (a couple of minutes on top of
      # the plain run), so CI is where the ratchet is actually enforced: without this
      # step a package can drift under its floor for weeks (the engine did, unnoticed).
      - name: Verify (coverage)
        run: bun run verify coverage

      - name: Check formatting
        run: bun run verify format

      - name: Build production bundles
        run: bun run build
