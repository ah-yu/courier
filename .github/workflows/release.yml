name: Release

# The publishing mirror's only workflow: build the plugin from **this** checkout, attest the
# assets, and publish them. It is generated by `scripts/mirror-plugin.ts` in courier.dev;
# edit `.github/mirror/release.yml` there, never this copy.
#
# Building here rather than copying artifacts from courier.dev is what makes the community
# directory's checks meaningful: build verification rebuilds this repository and compares
# the bytes, and `actions/attest-build-provenance` signs the run that produced them.

on:
  push:
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build plugin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the bundle
        run: bun run build

      - name: Stage the release assets
        run: |
          set -euo pipefail
          test -s packages/plugin/dist/main.js
          test -s packages/plugin/manifest.json
          test -s packages/plugin/styles.css
          rm -rf release-assets
          mkdir -p release-assets
          cp packages/plugin/dist/main.js release-assets/main.js
          cp packages/plugin/manifest.json release-assets/manifest.json
          cp packages/plugin/styles.css release-assets/styles.css

      - name: The tag and the manifest are one version
        run: |
          set -euo pipefail
          version="$(bun -p "require('./release-assets/manifest.json').version")"
          if [ "${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::manifest.json says ${version}, the tag says ${GITHUB_REF_NAME}"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          if-no-files-found: error
          retention-days: 1
          path: release-assets/

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plugin
          path: release-assets

      - name: Attest the assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release-assets/main.js
            release-assets/manifest.json
            release-assets/styles.css

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # `--repo` is not optional here: this job downloads an artifact and never checks the
          # repository out, so `gh` has no remote to infer the repository from and fails with
          # "fatal: not a git repository".
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            release-assets/main.js release-assets/manifest.json release-assets/styles.css
