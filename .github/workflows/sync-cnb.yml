name: Sync to CNB

# Keeps a public, read-only mirror of `main` on cnb.cool so people whose GitHub
# connection is slow can browse the source and use the raw install scripts.
# Release assets are mirrored by the `cnb` job in release.yml, not here.
#
# Inactive until the repository variable CNB_REPO is set; the token comes from
# the CNB_TOKEN secret (repo-code:rw).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-cnb
  cancel-in-progress: true

jobs:
  sync:
    name: Mirror main
    if: vars.CNB_REPO != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The source mirror is optional: a CNB outage must not make every push to
    # main look like a failed build. The job itself is still visible as failed.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push main
        env:
          CNB_REPO: ${{ vars.CNB_REPO }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CNB_TOKEN:-}" ]; then
            echo "::error::CNB_TOKEN is not configured"
            exit 1
          fi
          # Keep the token out of argv: the header lives in this checkout's
          # .git/config, which is discarded with the runner.
          repo="${CNB_REPO%.git}"
          git config --local "http.https://cnb.cool/.extraheader" \
            "AUTHORIZATION: basic $(printf 'cnb:%s' "$CNB_TOKEN" | base64 -w0)"
          git push --force "https://cnb.cool/$repo.git" "HEAD:refs/heads/main"
